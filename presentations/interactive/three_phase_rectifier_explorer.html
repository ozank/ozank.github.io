<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-Phase Diode Rectifier Explorer</title>
<link href="https://fonts.googleapis.com/css?family=Yanone+Kaffeesatz&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#1f2937; --muted:#6b7280; --grid:#e5e7eb; --panel:#f8fafc;
    --pa:#dc2626; --pb:#16a34a; --pc:#2563eb; --vd:#111827; --i:#ea580c; --ilt:#fdba74;
    --h1:#7c3aed; --au:#f59e0b; --pos:#16a34a; --ok:#047857;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:6px 14px 10px}
  header h1{font-family:'Yanone Kaffeesatz',sans-serif;font-weight:400;font-size:30px;margin:2px 0 0}
  header p{margin:0 0 4px;color:var(--muted)}
  body.embed header, body.embed .quiz{display:none}
  svg{width:100%;height:auto;display:block;user-select:none}
  svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .controls{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:4px}
  .slider{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
  .slider label{white-space:nowrap;font-weight:600;min-width:104px}
  .slider input{flex:1;min-width:0;accent-color:#374151}
  .buttons{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .buttons .lbl{font-size:12px;color:var(--muted);margin-right:-2px}
  .sep{width:1px;height:22px;background:var(--grid);margin:0 4px}
  button{font:inherit;font-size:13px;padding:4px 11px;border:1px solid #d1d5db;border-radius:6px;
    background:#fff;color:var(--fg);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:hover{background:#f3f4f6}
  button.on{background:#1f2937;color:#fff;border-color:#1f2937}
  input[type=range]{height:28px;touch-action:pan-y}
  .explain{margin-top:6px;padding:6px 11px;border-radius:8px;border:1px solid #bfdbfe;background:#eff6ff}
  .explain.comm{border-color:#fcd34d;background:#fffbeb}
  .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:3px 14px;
    margin-top:6px;background:var(--panel);padding:7px 11px;border-radius:8px;border:1px solid var(--grid)}
  .readout .k{color:var(--muted)}
  .quiz{margin-top:10px;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:7px 11px}
  .quiz h3{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .quiz .q{font-weight:600}
  .quiz .a{margin-top:6px;display:none;border-left:3px solid var(--ok);padding:2px 0 2px 10px}
  .quiz .a .ans{color:var(--ok);font-weight:600}
  .quiz .a .sec{margin-top:5px}
  .quiz .a .hd{font-weight:700;color:var(--vd)}
  .quiz .a button{margin-top:7px}
  .quiz .row{display:flex;gap:6px;margin-top:6px}
  body.embed .wrap{padding:0 6px 4px}
  body.embed .controls{gap:3px 12px;margin-top:0}
  body.embed .buttons{gap:4px}
  body.embed button{font-size:12px;padding:2px 8px}
  body.embed .slider input{height:22px}
  body.embed .slider label{font-size:13px;min-width:96px}
  body.embed .explain{font-size:12.5px;padding:3px 9px;margin-top:3px}
  body.embed .readout{font-size:12px;margin-top:3px;padding:3px 9px;gap:0 10px;grid-template-columns:repeat(4,1fr)}
  @media (max-height:500px){header{display:none}}
  @media (max-width:640px){
    .wrap{padding:4px 8px 12px}
    header h1{font-size:26px}
    .controls{gap:10px;margin-top:8px}
    .slider{flex:1 1 100%}
    .slider label{min-width:110px;font-size:15px}
    input[type=range]{height:36px}
    input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
    input[type=range]::-moz-range-thumb{width:26px;height:26px}
    .buttons{width:100%}
    .buttons button{flex:1 1 30%;min-height:40px;font-size:14px;padding:6px 4px}
    .buttons .lbl{width:100%}
    .sep{display:none}
    .readout{grid-template-columns:1fr 1fr;font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>3-Phase Diode Rectifier Explorer</h1>
    <p>400 V (line-to-line), 50 Hz supply with line inductance L<sub>s</sub>, load drawing a constant current I<sub>d</sub></p>
  </header>

  <svg id="fig" role="img" aria-label="Three-phase diode rectifier circuit, voltage and current waveforms and input current spectrum"></svg>

  <div class="controls">
    <div class="buttons">
      <span class="lbl">Circuit:</span>
      <button id="mB">Full bridge (6-pulse)</button><button id="mH">Half-wave (3-pulse)</button>
      <span class="sep"></span>
      <button id="pIdeal">L<sub>s</sub> = 0</button><button id="pTyp">2 mH, 40 A</button>
      <span class="sep"></span>
      <button id="play">▶ Play</button><button id="slow">Slow</button><button id="next">Next step ⏭</button>
    </div>
    <div class="slider"><label for="Ls">L<sub>s</sub> = <span id="Lsv"></span></label><input id="Ls" type="range" min="0" max="6" step="0.1"></div>
    <div class="slider"><label for="Id">I<sub>d</sub> = <span id="Idv"></span></label><input id="Id" type="range" min="5" max="60" step="1"></div>
    <div class="slider"><label for="tc">ωt = <span id="tcv"></span></label><input id="tc" type="range" min="0" max="360" step="any"></div>
  </div>

  <div class="explain" id="explain"></div>
  <div class="readout" id="out"></div>

  <div class="quiz">
    <h3>Check yourself <span id="qn"></span></h3>
    <div class="q" id="qq"></div>
    <div class="a" id="qa"></div>
    <div class="row buttons"><button id="qshow">Show answer</button><button id="qnext">Next ▶</button></div>
  </div>
</div>

<script>
(() => {
  const VLL = 400, VPH = VLL / Math.sqrt(3), VM = VPH * Math.SQRT2, VLM = VLL * Math.SQRT2;
  const F = 50, W = 2 * Math.PI * F, D = Math.PI / 180, PI = Math.PI;
  const KEEP = 0.5, NC = 360 / KEEP;                    // samples per cycle
  const PH = ['a', 'b', 'c'], PC = ['var(--pa)', 'var(--pb)', 'var(--pc)'];
  const DT = ['1', '3', '5'], DB = ['4', '6', '2'];      // top / bottom diode of phase a, b, c (Mohan numbering)
  const $ = id => document.getElementById(id);
  const fig = $('fig'), LsIn = $('Ls'), IdIn = $('Id'), tcIn = $('tc');
  const q = new URLSearchParams(location.search);
  if (q.has('embed')) document.body.classList.add('embed');
  let mode = q.get('mode') === 'half' ? 'H' : 'B';
  LsIn.value = q.has('Ls') ? +q.get('Ls') : 0; IdIn.value = q.has('Id') ? +q.get('Id') : 40; tcIn.value = q.has('wt') ? +q.get('wt') : 45;
  let playing = q.get('play') === '1', slow = false, last = null, dirty = true, flowOff = 0;

  const mod = (x, m) => ((x % m) + m) % m;
  const vph = (p, th) => VM * Math.sin(th - p * 120 * D);

  // ---------- analytical waveforms ----------
  // Commutation from phase p-1 to phase p (same group) starts where the two voltages cross.
  // During the overlap both phases conduct, the shared terminal sits at their average and
  // the incoming current is i = Ic(1 - cos x), Ic = √3·Vm / (2ωLs), until it reaches Id (x = u).
  let s = {};
  function compute() {
    const Ls = +LsIn.value / 1000, Id = +IdIn.value, X = W * Ls, B = mode === 'B';
    const Ic = X > 0 ? Math.sqrt(3) * VM / (2 * X) : Infinity;
    const k = Id / Ic;
    const u = X > 0 ? Math.acos(Math.max(-1, 1 - k)) : 0;
    const U120 = 120 * D;
    const grp = (th, off) => {                 // group state: currents per phase, overlap flag, terminal voltage
      const i = [0, 0, 0]; let ov = -1, v = 0, on = [];
      for (let p = 0; p < 3; p++) {
        const x = mod(th - (off + 120 * p) * D, 2 * PI);
        if (x < u) { i[p] = Ic * (1 - Math.cos(x)); ov = p; on.push(p); }
        else if (x < U120) { i[p] = Id; on.push(p); }
        else if (x < U120 + u) { i[p] = Id - Ic * (1 - Math.cos(x - U120)); on.push(p); }
      }
      if (ov >= 0) { const pr = (ov + 2) % 3; v = (vph(ov, th) + vph(pr, th)) / 2; }
      else v = vph(on[0], th);
      return {i, ov, v, on};
    };
    const one = th => {
      const T = grp(th, 30), Bt = B ? grp(th, 210) : null;
      const vP = T.v, vN = B ? Bt.v : 0;
      const va = vph(0, th), vb = vph(1, th), vc = vph(2, th);
      const env = B ? Math.max(va, vb, vc) - Math.min(va, vb, vc) : Math.max(va, vb, vc);
      const ip = [0, 1, 2].map(p => T.i[p] - (B ? Bt.i[p] : 0));
      return {T, Bt, vP, vN, vd: vP - vN, env, ip, ov: T.ov >= 0 || (B && Bt.ov >= 0)};
    };
    const S = {va: [], vb: [], vc: [], vP: [], vN: [], vd: [], env: [], ia: [], sq: [], ov: [], st: []};
    for (let n = 0; n <= NC; n++) {
      const th = n * KEEP * D, r = one(th);
      S.va.push(vph(0, th)); S.vb.push(vph(1, th)); S.vc.push(vph(2, th));
      S.vP.push(r.vP); S.vN.push(r.vN); S.vd.push(r.vd); S.env.push(r.env); S.ia.push(r.ip[0]); S.ov.push(r.ov); S.st.push(r);
      // ideal (Ls = 0) phase-a current
      const xa = mod(n * KEEP - 30, 360), xb = mod(n * KEEP - 210, 360);
      S.sq.push((xa < 120 ? Id : 0) - (B && xb < 120 ? Id : 0));
    }
    // averages and Fourier of i_a over one cycle (fine grid)
    const NF = 7200, H = 13; let vdA = 0, i0 = 0, i2 = 0, vmax = -1e9, vmin = 1e9; const a = [], b = [];
    for (let h = 0; h <= H; h++) { a[h] = 0; b[h] = 0; }
    for (let n = 0; n < NF; n++) {
      const th = n / NF * 2 * PI, r = one(th), ia = r.ip[0];
      vdA += r.vd; i0 += ia; i2 += ia * ia; vmax = Math.max(vmax, r.vd); vmin = Math.min(vmin, r.vd);
      for (let h = 1; h <= H; h++) { a[h] += ia * Math.cos(h * th); b[h] += ia * Math.sin(h * th); }
    }
    const I0 = i0 / NF, Irms = Math.sqrt(i2 / NF);
    const Ih = [Math.abs(I0)]; for (let h = 1; h <= H; h++) Ih[h] = Math.hypot(a[h], b[h]) * 2 / NF / Math.SQRT2;
    const I1 = Ih[1], phi1 = Math.atan2(a[1], b[1]);        // i_a1 = √2 I1 sin(θ + φ1)
    const thd = Math.sqrt(Math.max(0, Irms * Irms - I0 * I0 - I1 * I1)) / I1;
    const Vd = vdA / NF, Vd0 = (B ? 3 / PI : 1.5 / PI) * VLM, dVd = (B ? 3 / PI : 1.5 / PI) * X * Id;
    s = {Ls, Id, X, B, u, k, S, Ih, I0, Irms, I1, phi1, thd, dpf: Math.cos(phi1),
         pf: Vd * Id / (3 * VPH * Irms), Vd, Vd0, dVd, rip: vmax - vmin, bad: k > 0.5};
    ui(); dirty = true;
  }

  // ---------- text ----------
  const f1 = v => v.toFixed(1), sub = (m, x) => `${m}<sub>${x}</sub>`;
  const vLbl = (p, q2) => sub('v', PH[p] + PH[q2]);
  function stateText(r) {
    const T = r.T, Bt = r.Bt;
    const dn = (g, list) => list.map(p => sub('D', g[p])).join(' + ');
    const desc = (G, g, nm) => G.ov >= 0
      ? `${sub('D', g[(G.ov + 2) % 3])} → ${sub('D', g[G.ov])} commutating`
      : `${sub('D', g[G.on[0]])} on (${nm} = ${sub('v', PH[G.on[0]] + 'n')})`;
    return {T: desc(T, DT, sub('v', 'Pn')), B: s.B ? desc(Bt, DB, sub('v', 'Nn')) : '',
            pair: s.B && T.ov < 0 && Bt.ov < 0 ? `${dn(DT, T.on)}, ${dn(DB, Bt.on)} on: ${sub('v', 'd')} = ${vLbl(T.on[0], Bt.on[0])}` :
                  !s.B && T.ov < 0 ? `${sub('D', DT[T.on[0]])} on: ${sub('v', 'd')} = ${sub('v', PH[T.on[0]] + 'n')}` : ''};
  }
  function ui() {
    $('Lsv').textContent = (+LsIn.value).toFixed(1) + ' mH';
    $('Idv').textContent = IdIn.value + ' A';
    $('tcv').textContent = Math.round(+tcIn.value) + '°';
    $('mB').classList.toggle('on', s.B); $('mH').classList.toggle('on', !s.B);
    $('pIdeal').classList.toggle('on', +LsIn.value === 0);
    $('pTyp').classList.toggle('on', +LsIn.value === 2 && +IdIn.value === 40);
    const um = s.u / D, B = s.B;
    let h = `
      <div><span class="k">${sub('V', 'd')} =</span> <b>${f1(s.Vd)} V</b> <span class="k">= ${f1(s.Vd0)} − ${f1(s.dVd)}</span></div>
      <div><span class="k">${sub('V', 'd0')} = ${B ? '(3√2/π)' : '(3√2/2π)'}${sub('V', 'LL')} = ${B ? '1.35' : '0.675'}${sub('V', 'LL')}</span></div>
      <div><span class="k">Ripple Δ${sub('v', 'd')} =</span> <b>${f1(s.rip)} V</b> <span class="k">pk-pk at</span> <b>${B ? 300 : 150} Hz</b></div>
      <div><span class="k">ΔV<sub>d</sub> = ${B ? '3' : '3/2'}·ω${sub('L', 's')}${sub('I', 'd')}/π =</span> <b style="color:#b45309">${f1(s.dVd)} V</b></div>
      <div><span class="k">Overlap u =</span> <b>${f1(um)}°</b> <span class="k">(${(um / 18).toFixed(2)} ms)</span></div>
      <div><span class="k">${sub('I', 'a1')} =</span> <b>${f1(s.I1)} A</b>, <span class="k">${sub('I', 'a')} =</span> <b>${f1(s.Irms)} A</b>${B ? '' : `, <span class="k">DC</span> <b style="color:var(--pa)">${f1(s.I0)} A</b>`}</div>
      <div><span class="k">THD<sub>i</sub> =</span> <b style="color:var(--i)">${(s.thd * 100).toFixed(1)} %</b></div>
      <div><span class="k">DPF =</span> <b>${s.dpf.toFixed(3)}</b>, <span class="k">PF =</span> <b>${s.pf.toFixed(3)}</b></div>
      <div><span class="k">Each diode: ${sub('I', 'avg')} = ${sub('I', 'd')}/3 =</span> <b>${f1(s.Id / 3)} A</b></div>
      <div><span class="k">Diode PIV = √2${sub('V', 'LL')} =</span> <b>${VLM.toFixed(0)} V</b></div>
      ${B ? '' : `<div><span class="k">Neutral current ${sub('i', 'n')} = ${sub('I', 'd')} =</span> <b style="color:var(--pa)">${s.Id} A DC</b></div>`}`;
    if (s.bad) h += `<div style="color:#b91c1c"><b>u &gt; 60°:</b> overlaps would merge, outside this simple model</div>`;
    $('out').innerHTML = h;
    explain();
  }
  function explain() {
    const k = idx(), r = s.S.st[k], t = stateText(r), B = s.B;
    let x;
    if (r.ov) {
      const G = r.T.ov >= 0 ? r.T : r.Bt, g = r.T.ov >= 0 ? DT : DB, inP = G.ov, outP = (G.ov + 2) % 3;
      const term = r.T.ov >= 0 ? 'P' : 'N';
      x = `<b>Commutation ${sub('D', g[outP])} → ${sub('D', g[inP])}:</b> ${sub('L', 's')} stops ${sub('i', PH[outP])} from falling instantly, so both diodes conduct for u = ${f1(s.u / D)}°. ` +
          `Terminal ${term} sits at (${sub('v', PH[inP] + 'n')} + ${sub('v', PH[outP] + 'n')})/2, below the ideal envelope. The amber area is lost: ` +
          `${B ? 'six' : 'three'} commutations per cycle give ΔV<sub>d</sub> = ${B ? '3ωL<sub>s</sub>I<sub>d</sub>/π' : '3ωL<sub>s</sub>I<sub>d</sub>/2π'}.`;
    } else if (B) {
      const p = r.T.on[0], q2 = r.Bt.on[0];
      x = `<b>${t.pair}.</b> The top diode with the most positive anode (phase ${PH[p]}) and the bottom diode with the most negative cathode (phase ${PH[q2]}) conduct. ` +
          `${sub('v', 'd')} = ${sub('v', 'Pn')} − ${sub('v', 'Nn')} always follows the <b>largest line-to-line voltage</b>. A new pair every 60° → 6 pulses per cycle, each diode on for 120°.`;
    } else {
      const p = r.T.on[0];
      x = `<b>${t.pair}.</b> Only the diode on the most positive phase conducts; the current returns through the <b>neutral</b> (${sub('i', 'n')} = ${sub('I', 'd')}). ` +
          `3 pulses per cycle. Each phase current is a one-way 120° pulse, so it carries a DC component ${sub('I', 'd')}/3: bad news for a supply transformer.`;
    }
    if (s.X === 0 && !r.ov && Math.round(+tcIn.value) % 60 === 30) x += ' <i>(Exactly at a crossing: with L<sub>s</sub> = 0 the current switches instantly.)</i>';
    $('explain').innerHTML = x; $('explain').classList.toggle('comm', r.ov);
  }

  // ---------- layout ----------
  function layout() {
    const wide = fig.parentElement.clientWidth >= 640;
    return wide
      ? {W:880, H:398, sx:6, sy:6, spx0:34, spx1:300, spy0:284, spy1:378,
         px0:328, px1:872, p1:[6, 128], st:[134, 162], p2:[168, 292], p3:[300, 384], fs:13, sm:11, wide}
      : {W:400, H:790, sx:50, sy:4, spx0:36, spx1:392, spy0:668, spy1:770,
         px0:30, px1:394, p1:[262, 380], st:[386, 414], p2:[420, 530], p3:[538, 636], fs:13, sm:11, wide};
  }
  let L_ = layout();

  // ---------- svg helpers ----------
  const T = (x, y, str, o = {}) =>
    `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" font-size="${o.fs || L_.fs}" fill="${o.c || 'var(--fg)'}" text-anchor="${o.a || 'start'}"` +
    `${o.w ? ` font-weight="${o.w}"` : ''} dominant-baseline="${o.b || 'auto'}">${str}</text>`;
  const sb = (m, x, tail = '') => `${m}<tspan dy="3" font-size="75%">${x}</tspan><tspan dy="-3">${tail}</tspan>`;
  const line = (x1, y1, x2, y2, c, w = 1, dash = '') =>
    `<line x1="${(+x1).toFixed(1)}" y1="${(+y1).toFixed(1)}" x2="${(+x2).toFixed(1)}" y2="${(+y2).toFixed(1)}" stroke="${c}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  const poly = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const WC = '#374151';
  // a current-carrying path segment, drawn in the direction of current flow
  const flow = pts => `<polyline points="${poly(pts)}" fill="none" stroke="var(--ilt)" stroke-width="4" stroke-linejoin="round"/>` +
    `<polyline class="flow" points="${poly(pts)}" fill="none" stroke="var(--i)" stroke-width="2.2" stroke-dasharray="5 7" stroke-linejoin="round"/>`;
  function diode(P, Q, st, label, f) {        // anode P → cathode Q; st: 0 off, 1 on, 2 commutating
    const mx = P[0] + (Q[0] - P[0]) * f, my = P[1] + (Q[1] - P[1]) * f, ang = Math.atan2(Q[1] - P[1], Q[0] - P[0]) / D;
    const c = st === 2 ? 'var(--au)' : st ? 'var(--pos)' : '#fff';
    return `<g transform="translate(${mx.toFixed(1)},${my.toFixed(1)}) rotate(${ang.toFixed(1)})"><polygon points="-7,-7 -7,7 7,0" fill="${c}" stroke="${WC}" stroke-width="1.4"/>` +
      `<line x1="7" y1="-7" x2="7" y2="7" stroke="${WC}" stroke-width="2.2"/></g>` +
      T(mx + 11, my + 4, sb('D', label), {fs: L_.sm, w: 700, c: st === 2 ? '#b45309' : st ? 'var(--pos)' : 'var(--muted)'});
  }
  function coil(x0, y, len) {
    let d = `M${x0},${y}`; const n = 3, w = len / n;
    for (let k = 0; k < n; k++) d += ` a${w / 2},5 0 0 1 ${w},0`;
    return `<path d="${d}" fill="none" stroke="${WC}" stroke-width="1.7"/>`;
  }
  function source(x, y, c) {
    return `<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="${c}" stroke-width="1.8"/>` +
      `<path d="M${x - 8},${y} q4,-8 8,0 t8,0" fill="none" stroke="${c}" stroke-width="1.5"/>`;
  }
  function isrc(x, y) {
    return `<circle cx="${x}" cy="${y}" r="12" fill="#fff" stroke="${WC}" stroke-width="1.5"/>` +
      line(x, y - 7, x, y + 5, WC, 1.6) + `<polygon points="${x - 4},${y + 1} ${x + 4},${y + 1} ${x},${y + 7}" fill="${WC}"/>`;
  }
  const hopH = (x, y) => line(x - 5.5, y, x + 5.5, y, '#fff', 3) + line(x, y - 7, x, y + 7, WC, 1.5) +
    `<path d="M${x - 5},${y} a5,5 0 0 1 10,0" fill="none" stroke="${WC}" stroke-width="1.5"/>`;

  // ---------- circuit ----------
  function circuit(r) {
    const ox = L_.sx, oy = L_.sy, P = (x, y) => [ox + x, oy + y];
    const B = s.B, Y = [58, 114, 170], X = [150, 190, 230], yP = 18, yN = 222, xL = 282, xn = 14, xs = 44, eps = 1e-6;
    let g = '', fl = '', hops = '';
    // currents per phase and per diode
    const iT = r.T.i, iB = B ? r.Bt.i : [0, 0, 0], ip = r.ip;
    // phase wires: source → Ls → leg node (with hops over earlier legs)
    for (let p = 0; p < 3; p++) {
      const y = Y[p];
      g += line(ox + xn, oy + y, ox + xs - 13, oy + y, WC, 1.5) + source(ox + xs, oy + y, PC[p]);
      g += line(ox + xs + 13, oy + y, ox + 72, oy + y, WC, 1.5) + (s.X > 0 ? coil(ox + 72, oy + y, 30) : line(ox + 72, oy + y, ox + 102, oy + y, WC, 1.5));
      g += line(ox + 102, oy + y, ox + X[p], oy + y, WC, 1.5);
      if (B) for (let j = 0; j < p; j++) hops += hopH(ox + X[j], oy + y);
      g += T(ox + xs + 16, oy + y - 7, PH[p], {fs: L_.sm, w: 700, c: PC[p]});
      g += `<circle cx="${ox + X[p]}" cy="${oy + y}" r="2.5" fill="${WC}"/>`;
      if (Math.abs(ip[p]) > eps) {
        const pts = [P(xn, Y[1]), P(xn, y), P(xs - 13, y)], pts2 = [P(xs + 13, y), P(X[p], y)];
        fl += ip[p] > 0 ? flow(pts) + flow(pts2) : flow(pts2.slice().reverse()) + flow(pts.slice().reverse());
      }
    }
    g += line(ox + xn, oy + Y[0], ox + xn, oy + Y[2], WC, 1.5) + `<circle cx="${ox + xn}" cy="${oy + Y[1]}" r="3" fill="${WC}"/>`;
    g += T(ox + xn - 5, oy + Y[1] + 4, 'n', {a: 'end', w: 700});
    g += T(ox + 87, oy + Y[0] - 10, s.X > 0 ? sb('L', 's') : sb('L', 's', ' = 0'), {a: 'middle', fs: L_.sm, w: 700});
    // i_a arrow
    g += line(ox + 108, oy + Y[0] + 10, ox + 132, oy + Y[0] + 10, 'var(--pa)', 1.3) +
         `<polygon points="${ox + 132},${oy + Y[0] + 6} ${ox + 139},${oy + Y[0] + 10} ${ox + 132},${oy + Y[0] + 14}" fill="var(--pa)"/>` +
         T(ox + 120, oy + Y[0] + 24, sb('i', 'a'), {a: 'middle', fs: L_.sm, w: 700, c: 'var(--pa)'});
    // top group
    const dyT = 38, dyB = 202;
    for (let p = 0; p < 3; p++) {
      g += line(ox + X[p], oy + Y[p], ox + X[p], oy + yP, WC, 1.5);
      if (iT[p] > eps) fl += flow([P(X[p], Y[p]), P(X[p], yP)]);
    }
    g += line(ox + X[0], oy + yP, ox + xL, oy + yP, WC, 1.5);
    const topOn = [0, 1, 2].filter(p => iT[p] > eps);
    fl += flow([P(X[Math.min(...topOn)], yP), P(xL, yP)]);
    // load
    g += line(ox + xL, oy + yP, ox + xL, oy + 108, WC, 1.5) + isrc(ox + xL, oy + 120);
    fl += flow([P(xL, yP), P(xL, 108)]);
    g += T(ox + xL - 16, oy + 124, sb('I', 'd'), {a: 'end', fs: L_.sm, w: 700});
    g += T(ox + 263, oy + 40, '+', {a: 'middle', w: 700}) + T(ox + 263, oy + 84, sb('v', 'd'), {a: 'middle', w: 700});
    g += T(ox + X[0] - 6, oy + yP - 4, 'P', {a: 'end', w: 700, fs: L_.sm});
    if (B) {
      for (let p = 0; p < 3; p++) {
        g += line(ox + X[p], oy + yN, ox + X[p], oy + Y[p], WC, 1.5);
        if (iB[p] > eps) fl += flow([P(X[p], yN), P(X[p], Y[p])]);
      }
      g += line(ox + X[0], oy + yN, ox + xL, oy + yN, WC, 1.5) + line(ox + xL, oy + 132, ox + xL, oy + yN, WC, 1.5);
      const botOn = [0, 1, 2].filter(p => iB[p] > eps);
      fl += flow([P(xL, 132), P(xL, yN), P(X[Math.min(...botOn)], yN)]);
      g += T(ox + 263, oy + 206, '−', {a: 'middle', w: 700});
      g += T(ox + X[0] - 6, oy + yN + 12, 'N', {a: 'end', w: 700, fs: L_.sm});
      // hops of legs crossing lower phase wires are drawn on the horizontal wires above
    } else {
      const yr = 236;
      g += line(ox + xL, oy + 132, ox + xL, oy + yr, WC, 1.5) + line(ox + xL, oy + yr, ox + xn, oy + yr, WC, 1.5) + line(ox + xn, oy + yr, ox + xn, oy + Y[2], WC, 1.5);
      fl += flow([P(xL, 132), P(xL, yr), P(xn, yr), P(xn, Y[1])]);
      g += T(ox + 263, oy + 206, '−', {a: 'middle', w: 700}) + T(ox + 150, oy + yr - 5, sb('i', 'n', ` = I`) + `<tspan dy="3" font-size="75%">d</tspan><tspan dy="-3"> (neutral)</tspan>`, {a: 'middle', fs: L_.sm, w: 700, c: 'var(--pa)'});
    }
    g += hops + fl;
    // diode symbols last (on top of flows)
    for (let p = 0; p < 3; p++) {
      const stT = iT[p] > eps ? (r.T.ov >= 0 && (p === r.T.ov || p === (r.T.ov + 2) % 3) ? 2 : 1) : 0;
      g += diode(P(X[p], Y[p]), P(X[p], yP), stT, DT[p], (Y[p] - dyT) / (Y[p] - yP));
      if (B) {
        const stB = iB[p] > eps ? (r.Bt.ov >= 0 && (p === r.Bt.ov || p === (r.Bt.ov + 2) % 3) ? 2 : 1) : 0;
        g += diode(P(X[p], yN), P(X[p], Y[p]), stB, DB[p], (yN - dyB) / (yN - Y[p]));
      }
    }
    [[X[1], yP], [X[2], yP], [xL, yP]].concat(B ? [[X[1], yN], [X[2], yN], [xL, yN]] : []).forEach(pt => g += `<circle cx="${ox + pt[0]}" cy="${oy + pt[1]}" r="2.5" fill="${WC}"/>`);
    return g;
  }

  // ---------- plot panels ----------
  function panel(y0, y1, lo, hi) {
    const {px0, px1} = L_;
    const xs = k => px0 + k / NC * (px1 - px0), ys = v => y1 - (v - lo) / (hi - lo) * (y1 - y0);
    let g = `<rect x="${px0}" y="${y0}" width="${px1 - px0}" height="${y1 - y0}" fill="var(--panel)" stroke="var(--grid)"/>`;
    for (let a = 30; a < 360; a += 30) g += line(xs(a / KEEP), y0, xs(a / KEEP), y1, 'var(--grid)', 1, (a - 30) % 60 ? '2 4' : '');
    if (lo < 0) g += line(px0, ys(0), px1, ys(0), '#94a3b8');
    return {g, xs, ys};
  }
  const pl = (arr, P, c, w, dash = '', op = 1) => `<polyline points="${poly(arr.map((v, k) => [P.xs(k), P.ys(v)]))}" fill="none" stroke="${c}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}${op < 1 ? ` stroke-opacity="${op}"` : ''}/>`;
  function lostArea(P, top, bot) {           // shade between top and bot where overlap is active
    let g = '', k = 0; const S = s.S, N = S.ov.length;
    while (k < N) {
      if (S.ov[k]) {
        const a = k; while (k < N && S.ov[k]) k++;
        const e = Math.min(k, N - 1), up = [], dn = [];
        for (let j = a; j <= e; j++) { up.push([P.xs(j), P.ys(top[j])]); dn.push([P.xs(j), P.ys(bot[j])]); }
        g += `<polygon points="${poly(up.concat(dn.reverse()))}" fill="var(--au)" fill-opacity="0.55"/>`;
      } else k++;
    }
    return g;
  }
  function strips(y0, y1) {
    const {px0, px1} = L_, xs = a => px0 + a / 360 * (px1 - px0), u = s.u / D, B = s.B;
    const rows = B ? [[30, DT, 'top'], [210, DB, 'bottom']] : [[30, DT, 'top']];
    const h = (y1 - y0 - 2) / 2;
    let g = '';
    rows.forEach(([off, names], ri) => {
      const ya = y0 + ri * (h + 2);
      const seg = (a, len, fill, op) => {         // draw [a, a+len) with wrap at 360
        a = mod(a, 360); let out = '';
        const parts = a + len <= 360 ? [[a, a + len]] : [[a, 360], [0, a + len - 360]];
        parts.forEach(([p0, p1]) => out += `<rect x="${xs(p0).toFixed(1)}" y="${ya}" width="${(xs(p1) - xs(p0)).toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" fill-opacity="${op}"/>`);
        return out;
      };
      for (let p = 0; p < 3; p++) {
        const st = off + 120 * p;
        g += seg(st + u, 120 - u, PC[p], 0.22);
        if (u > 0) g += seg(st, u, 'var(--au)', 0.8);
        const c = mod(st + 60 + u / 2, 360);
        g += T(xs(c), ya + h / 2 + 4, sb('D', names[p]), {a: 'middle', fs: L_.sm - 1, w: 700, c: PC[p]});
      }
    });
    if (!B) g += T((px0 + px1) / 2, y0 + h + 2 + h / 2 + 4, 'no bottom group: current returns via the neutral', {a: 'middle', fs: L_.sm - 1, c: 'var(--muted)'});
    return g;
  }

  const idx = () => Math.min(NC, Math.round(+tcIn.value / KEEP));
  function draw() {
    const S = s.S, B = s.B, {px0, px1} = L_, k = idx(), r = S.st[k];
    let g = circuit(r);
    const lab = (P, y0, items) => { let x = px0 + 5, o = ''; items.forEach(([t, c, w]) => { o += T(x, y0 + 13, t, {c, w: 700, fs: L_.sm}); x += w; }); return o; };
    // panel 1: phase voltages and the two output terminals
    const P1 = panel(L_.p1[0], L_.p1[1], -VM * 1.15, VM * 1.5);
    const vNarr = B ? S.vN : S.vP.map(() => 0);
    g += P1.g + `<polygon points="${poly(S.vP.map((v, j) => [P1.xs(j), P1.ys(v)]).concat(vNarr.map((v, j) => [P1.xs(j), P1.ys(v)]).reverse()))}" fill="#94a3b8" fill-opacity="0.18"/>`;
    g += lostArea(P1, S.va.map((_, j) => Math.max(S.va[j], S.vb[j], S.vc[j])), S.vP);
    if (B) g += lostArea(P1, S.vN, S.va.map((_, j) => Math.min(S.va[j], S.vb[j], S.vc[j])));
    g += pl(S.va, P1, 'var(--pa)', 1.3, '', 0.8) + pl(S.vb, P1, 'var(--pb)', 1.3, '', 0.8) + pl(S.vc, P1, 'var(--pc)', 1.3, '', 0.8);
    g += pl(S.vP, P1, 'var(--vd)', 2.4) + (B ? pl(S.vN, P1, 'var(--vd)', 2.4, '6 3') : '');
    g += lab(P1, L_.p1[0], [[sb('v', 'an'), 'var(--pa)', 32], [sb('v', 'bn'), 'var(--pb)', 32], [sb('v', 'cn'), 'var(--pc)', 38],
                            [sb('v', 'Pn'), 'var(--vd)', 38]].concat(B ? [[sb('v', 'Nn', ' (dashed)'), 'var(--vd)', 80]] : []));
    g += T(px1 - 4, L_.p1[0] + 13, 'shaded gap = ' + sb('v', 'd'), {a: 'end', fs: L_.sm - 1, c: 'var(--muted)'});
    // conduction strips
    g += strips(L_.st[0], L_.st[1]);
    // panel 2: vd with the line-to-line (or phase) voltages behind it
    const P2 = panel(L_.p2[0], L_.p2[1], 0, VLM * 1.3);
    g += P2.g;
    if (B) {
      const ll = [[0, 1], [0, 2], [1, 2], [1, 0], [2, 0], [2, 1]], arr = [S.va, S.vb, S.vc];
      ll.forEach(([i, j]) => {
        const seq = arr[i].map((v, n) => v - arr[j][n]);
        let pts = [];
        seq.forEach((v, n) => { if (v > 0) pts.push([P2.xs(n), P2.ys(v)]); else if (pts.length) { g += `<polyline points="${poly(pts)}" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>`; pts = []; } });
        if (pts.length) g += `<polyline points="${poly(pts)}" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>`;
      });
    } else {
      [S.va, S.vb, S.vc].forEach((arr, p) => g += pl(arr.map(v => Math.max(v, 0)), P2, PC[p], 1, '3 3', 0.6));
    }
    g += lostArea(P2, S.env, S.vd);
    g += pl(S.vd, P2, 'var(--vd)', 2.6);
    g += line(px0, P2.ys(s.Vd), px1, P2.ys(s.Vd), 'var(--vd)', 1.4, '7 4');
    g += T(px1 - 4, L_.p2[1] - 6, 'dashed line: average ' + sb('V', 'd', ` = ${f1(s.Vd)} V`) + (s.X > 0 ? `  (ideal ${f1(s.Vd0)} V)` : ''), {a: 'end', c: 'var(--vd)', fs: L_.sm, w: 700});
    g += lab(P2, L_.p2[0], [[sb('v', 'd'), 'var(--vd)', 28], [B ? 'line-to-line voltages (dashed)' : 'phase voltages (dashed)', '#64748b', 200]]
                           .concat(s.X > 0 ? [['lost area', '#b45309', 60]] : []));
    // panel 3: i_a
    const Id = s.Id, P3 = panel(L_.p3[0], L_.p3[1], -Id * 1.45, Id * 2);
    const fund = S.ia.map((v, j) => Math.SQRT2 * s.I1 * Math.sin(j * KEEP * D + s.phi1) + s.I0);
    const vas = S.va.map(v => v / VM * Id * 1.25);
    g += P3.g + pl(vas, P3, 'var(--pa)', 1, '', 0.35) + pl(S.sq, P3, '#94a3b8', 1.3, '4 3') + pl(fund, P3, 'var(--h1)', 1.4, '2 3') + pl(S.ia, P3, 'var(--i)', 2.6);
    g += lab(P3, L_.p3[0], [[sb('i', 'a'), 'var(--i)', 24], [sb('i', 'a1', ' (fundamental)'), 'var(--h1)', 116], [sb('v', 'an', ' (scaled)'), 'var(--pa)', 70]]);
    if (s.X > 0) g += T(px1 - 4, L_.p3[0] + 13, 'dashed grey: Ls = 0', {a: 'end', c: '#94a3b8', fs: L_.sm - 1, w: 700});
    [0, 60, 120, 180, 240, 300, 360].forEach(a => g += T(P3.xs(a / KEEP), L_.p3[1] + 12, a + '°', {a: a === 0 ? 'start' : a === 360 ? 'end' : 'middle', fs: L_.sm - 1, c: 'var(--muted)'}));
    // cursor
    const xc = P1.xs(k);
    g += line(xc, L_.p1[0], xc, L_.p3[1], '#111827', 1.3);
    g += `<circle cx="${xc}" cy="${P1.ys(S.vP[k])}" r="3.5" fill="var(--vd)"/>` + (B ? `<circle cx="${xc}" cy="${P1.ys(S.vN[k])}" r="3.5" fill="var(--vd)"/>` : '');
    g += `<circle cx="${xc}" cy="${P2.ys(S.vd[k])}" r="4" fill="var(--vd)"/><circle cx="${xc}" cy="${P3.ys(S.ia[k])}" r="4" fill="var(--i)"/>`;
    g += spectrum();
    fig.innerHTML = g;
    setFlow();
  }
  function setFlow() { fig.querySelectorAll('.flow').forEach(e => e.setAttribute('stroke-dashoffset', flowOff.toFixed(1))); }

  function spectrum() {
    const {spx0, spx1, spy0, spy1} = L_, H = 13, bw = (spx1 - spx0) / (H + 1);
    const top = spy0 + 18, ys = p => spy1 - Math.min(p, 100) / 100 * (spy1 - top);
    let g = T(spx0 - 26, spy0 + 6, `Harmonics of i<tspan dy="3" font-size="75%">a</tspan><tspan dy="-3"> (% of I</tspan><tspan dy="3" font-size="75%">a1</tspan><tspan dy="-3">)   THD = ${(s.thd * 100).toFixed(1)} %</tspan>`, {fs: L_.sm, w: 700});
    g += line(spx0, spy1, spx1, spy1, '#94a3b8');
    [25, 50, 75, 100].forEach(p => g += line(spx0, ys(p), spx1, ys(p), 'var(--grid)', 1, '2 3') + T(spx0 - 3, ys(p) + 4, p, {a: 'end', fs: L_.sm - 2, c: 'var(--muted)'}));
    for (let h = 0; h <= H; h++) {
      const x = spx0 + (h + 0.5) * bw, p = s.Ih[h] / s.I1 * 100;
      if (s.B && h > 1 && (h % 6 === 1 || h % 6 === 5)) { const pi = 100 / h; g += `<rect x="${(x - bw * 0.36).toFixed(1)}" y="${ys(pi).toFixed(1)}" width="${(bw * 0.72).toFixed(1)}" height="${(spy1 - ys(pi)).toFixed(1)}" fill="none" stroke="#94a3b8" stroke-dasharray="2 2"/>`; }
      if (p > 0.3) g += `<rect x="${(x - bw * 0.26).toFixed(1)}" y="${ys(p).toFixed(1)}" width="${(bw * 0.52).toFixed(1)}" height="${(spy1 - ys(p)).toFixed(1)}" fill="${h === 1 ? 'var(--h1)' : h === 0 ? 'var(--pa)' : h % 3 === 0 ? '#be123c' : 'var(--i)'}"/>`;
      g += T(x, spy1 + 11, h === 0 ? 'DC' : h, {a: 'middle', fs: L_.sm - 2, c: h % 3 === 0 && h ? '#be123c' : 'var(--muted)'});
    }
    g += T(spx1, top - 2, s.B ? '┄ 1/h (Ls = 0)   only h = 6k ± 1' : 'DC, even and triplen (red) present', {a: 'end', fs: L_.sm - 2, c: 'var(--muted)'});
    return g;
  }

  // ---------- loop & events ----------
  function tick(t) {
    if (last !== null) {
      const dt = (t - last) / 1000;
      if (playing) {
        let v = +tcIn.value + dt * (slow ? 15 : 45);
        if (v >= 360) v -= 360; tcIn.value = v; $('tcv').textContent = Math.round(v) + '°'; dirty = true;
      }
      flowOff -= dt * (slow ? 10 : 24);
      if (!dirty) setFlow();
    }
    last = t;
    if (dirty) { draw(); explain(); dirty = false; }
    requestAnimationFrame(tick);
  }
  function setLayout() { L_ = layout(); fig.setAttribute('viewBox', `0 0 ${L_.W} ${L_.H}`); dirty = true; }
  LsIn.addEventListener('input', compute); IdIn.addEventListener('input', compute);
  tcIn.addEventListener('input', () => { $('tcv').textContent = Math.round(+tcIn.value) + '°'; dirty = true; });
  $('mB').addEventListener('click', () => { mode = 'B'; compute(); });
  $('mH').addEventListener('click', () => { mode = 'H'; compute(); });
  $('pIdeal').addEventListener('click', () => { LsIn.value = 0; compute(); });
  $('pTyp').addEventListener('click', () => { LsIn.value = 2; IdIn.value = 40; compute(); });
  function setPlaying(on) { playing = on; $('play').textContent = on ? '❚❚ Pause' : '▶ Play'; $('play').classList.toggle('on', on); }
  $('play').addEventListener('click', () => setPlaying(!playing));
  $('slow').addEventListener('click', e => { slow = !slow; e.currentTarget.classList.toggle('on', slow); });
  $('next').addEventListener('click', () => {
    // stops: middle of each commutation (if Ls > 0) and middle of each normal-conduction interval
    const step = s.B ? 60 : 120, um = s.u / D, cur = +tcIn.value, stops = [];
    for (let e = 30 - step; e < 360 + 2 * step; e += step) {
      if (um > 0) stops.push(e + um / 2);
      stops.push(e + um + (step - um) / 2);
    }
    const nxt = stops.map(a => Math.round(a)).find(a => a > cur + 0.5);
    setPlaying(false); tcIn.value = mod(nxt, 360); ui(); dirty = true;
  });
  window.addEventListener('resize', setLayout);
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); $('play').click(); return; }
    const nav = {ArrowRight: 'gotoNextSlide', PageDown: 'gotoNextSlide', ArrowLeft: 'gotoPreviousSlide', PageUp: 'gotoPreviousSlide'}[e.key];
    try { if (nav && window.parent !== window && window.parent.slideshow) window.parent.slideshow[nav](); } catch (_) {}
  });

  // ---------- quiz ----------
  const QUIZ = [
    {q: 'Full bridge, L<sub>s</sub> = 0, ωt = 45°. Which two diodes conduct, and which voltage appears across the load?',
     ans: '<b>D<sub>1</sub> and D<sub>6</sub></b>; v<sub>d</sub> = <b>v<sub>ab</sub></b>.',
     wf: 'At 45° phase a is the most positive (top group picks the highest anode, D<sub>1</sub>) and phase b is the most negative (bottom group picks the lowest cathode, D<sub>6</sub>). So v<sub>d</sub> = v<sub>an</sub> − v<sub>bn</sub> = v<sub>ab</sub>, the largest of the six line-to-line voltages at that instant.',
     state: ['B', 0, 40, 45]},
    {q: 'Full bridge, L<sub>s</sub> = 0. What are the ripple frequency and the peak-to-peak ripple of v<sub>d</sub>?',
     ans: '<b>300 Hz</b>, Δv<sub>d</sub> = √2·V<sub>LL</sub>(1 − cos 30°) = <b>75.8 V</b>.',
     wf: 'A new diode pair every 60° gives 6 pulses per 20 ms period. Each pulse is a 60° slice of a line-to-line sine around its peak: maximum √2V<sub>LL</sub> = 566 V, minimum at ±30° from the peak, 566·cos 30° = 490 V. Compare the half-wave: 150 Hz and 163 V.',
     state: ['B', 0, 40, 90]},
    {q: 'Switch to the half-wave (3-pulse) circuit. Why is it rarely fed from a transformer?',
     ans: 'Each phase current has a <b>DC component I<sub>d</sub>/3</b>, and the neutral carries the full I<sub>d</sub>.',
     wf: 'The phase current is a one-way 120° pulse (0 or I<sub>d</sub>), never negative, so its average is I<sub>d</sub>/3. That DC flows through the transformer windings and pushes the core toward saturation. Look at the spectrum: a DC bar, plus even and triplen harmonics that the bridge does not have.',
     state: ['H', 0, 40, 90]},
    {q: 'Full bridge, L<sub>s</sub> = 0. Find I<sub>a1</sub>/I<sub>d</sub>, the THD and the power factor.',
     ans: 'I<sub>a1</sub> = (√6/π)·I<sub>d</sub> = <b>0.78·I<sub>d</sub></b>, THD = <b>31 %</b>, PF = 3/π = <b>0.955</b>.',
     wf: 'i<sub>a</sub> is ±I<sub>d</sub> for 120°, zero for 60°: I<sub>a</sub> = √(2/3)·I<sub>d</sub> = 0.816·I<sub>d</sub>. Its harmonics are only h = 6k ± 1 (5, 7, 11, 13 …) with I<sub>h</sub> = I<sub>a1</sub>/h: the 120° width kills the triplens, half-wave symmetry kills the evens. The fundamental is in phase with v<sub>an</sub> (DPF = 1), so PF = I<sub>a1</sub>/I<sub>a</sub> = 0.955.',
     state: ['B', 0, 40, 30]},
    {q: 'Full bridge, L<sub>s</sub> = 2 mH, I<sub>d</sub> = 40 A. Find the overlap angle u and the DC voltage.',
     ans: 'u ≈ <b>24.3°</b>, V<sub>d</sub> ≈ 540 − 24 = <b>516 V</b>.',
     wf: 'ωL<sub>s</sub> = 0.628 Ω. cos u = 1 − 2ωL<sub>s</sub>I<sub>d</sub>/(√2V<sub>LL</sub>) = 1 − 2·0.628·40/566 = 0.911 → u = 24.3°. ΔV<sub>d</sub> = 3ωL<sub>s</sub>I<sub>d</sub>/π = 3·0.628·40/π = 24.0 V. Use "Next step" to walk through the six amber notches and the normal conduction between them.',
     state: ['B', 2, 40, 42]},
    {q: 'Why is ΔV<sub>d</sub> = 3ωL<sub>s</sub>I<sub>d</sub>/π for the bridge but only half of that for the half-wave circuit?',
     ans: 'The bridge has <b>6</b> commutations per cycle, the half-wave only <b>3</b>; each one loses the same area ωL<sub>s</sub>I<sub>d</sub>.',
     wf: 'During one commutation the two conducting phases are shorted through 2L<sub>s</sub>, the terminal sits at their average and the lost area is ∫ v<sub>ac</sub>/2 dθ = ωL<sub>s</sub>I<sub>d</sub>. Average over 2π: 6·ωL<sub>s</sub>I<sub>d</sub>/2π = 3ωL<sub>s</sub>I<sub>d</sub>/π, or 3·ωL<sub>s</sub>I<sub>d</sub>/2π for 3 pulses. Like the single-phase case, the rectifier behaves as a DC source with an internal (lossless) resistance 3ωL<sub>s</sub>/π.',
     state: ['H', 2, 40, 42]},
  ];
  let qi = 0;
  function showQ() {
    const Q = QUIZ[qi];
    $('qn').textContent = `(${qi + 1}/${QUIZ.length})`;
    $('qq').innerHTML = Q.q;
    $('qa').innerHTML = `<div class="ans">${Q.ans}</div><div class="sec"><span class="hd">With waveforms:</span> ${Q.wf}</div>
      <button id="qdemo">Show it on the diagram ↑</button>`;
    $('qa').style.display = 'none'; $('qshow').textContent = 'Show answer';
    $('qdemo').addEventListener('click', () => {
      [mode, LsIn.value, IdIn.value, tcIn.value] = Q.state; setPlaying(false); compute();
      fig.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
  }
  $('qshow').addEventListener('click', () => {
    const on = $('qa').style.display !== 'block';
    $('qa').style.display = on ? 'block' : 'none'; $('qshow').textContent = on ? 'Hide answer' : 'Show answer';
  });
  $('qnext').addEventListener('click', () => { qi = (qi + 1) % QUIZ.length; showQ(); });

  setLayout(); setPlaying(playing); compute(); showQ(); requestAnimationFrame(tick);
})();
</script>
