# Sinusoid

## Sinusoid: Signal that has the form of the sine or cosine function.

## \\( V(t) = V\_{max} sin (\omega t) \\)

#### or

## \\( V(t) = V\_{max} cos (\omega t) \\)
---
# \\( V(t) = V\_{max} sin (\omega t) \\)

 ## \\( V\_{max}\\) : Amplitude
 ## \\( \omega\\) : Angular velocity (radians/second)
 ## \\( t \\) : Time (seconds)
--

## \\(f\\): Frequency in Hertz (Hz)
## \\(\omega = 2 \pi f\\): Frequency radians/s

---
# Phase Difference: \\( V(t) = V\_{max} sin (\omega t + \phi) \\)
--

## \\(\phi\\): Phase (radians)

<img src="https://raw.githubusercontent.com/ozank/ee281/master/images/phase_difference.png" alt="Drawing" style="width: 500px;"/>

## \\(\phi > 0\\): the signal leads (reaches its peak earlier)

--


## \\( sin (\omega t + \pi /2)\\) =

# Where does a phasor come from?
## Euler: \\(e^{j\theta} = cos\theta + j\,sin\theta\\)
--

## \\(V\_m cos(\omega t + \phi) = Re\\{ V\_m e^{j\phi} \, e^{j\omega t}\\}\\)
--

## \\(e^{j\omega t}\\): the same rotation for every signal in the circuit, so drop it
## \\(\mathbf{V} = V\_m \angle \phi\\): only the amplitude and phase remain

---

# What is RMS?

# RMS = \\( \sqrt{\dfrac{1}{T}\int_0^T (f(t))^2 dt}\\)

--
## In Plain English:

## The RMS value of an AC signal is equal to the value of direct current (DC) which would have the same power dissipation as the AC.
---
# RMS of a Sinusoid
## \\(V\_{rms} = \sqrt{\dfrac{1}{T}\int\_0^T V\_m^2 cos^2(\omega t)\, dt}\\)
--

## \\(\quad\quad = \sqrt{\dfrac{V\_m^2}{2}} = \dfrac{V\_m}{\sqrt{2}}\\)
--

## 230 V\\(\_{rms}\\) → 325 V peak

# Active and Reactive Power

### What is the average power (in Watts) dissipated in an inductor with an impedance of   \\(j 1 \, \Omega\\) while carrying a 1 A(rms) current?

## Real power only dissipates in resistive components.
## Ideal L and C store energy for a quarter cycle and return it in the next: the average power is zero. Reactive power describes this back-and-forth energy exchange.

# Complex Power
## \\(S = V\_{rms} I\_{rms}^\* = P + jQ\\)
--

## \\(P = V I cos\theta \quad\\) (W)
## \\(Q = V I sin\theta \quad\\) (var), positive for inductive loads
## \\(|S| = V I = \sqrt{P^2 + Q^2} \quad\\) (VA)

---
# Example
### A 230 V (rms), 50 Hz supply feeds a series load: R = 8 Ω, L = 19.1 mH. Find: \\(Z, I, \theta\\), PF, P, Q, S
--

### \\(X\_L = 2\pi 50 \times 0.0191 = 6\,\Omega\\)
### \\(Z = 8 + j6 = 10 \angle 36.9° \,\Omega\\)
--

### \\(I = 230/10 = 23\\) A (rms), lagging by 36.9°
--

### PF = cos(36.9°) = 0.8 lagging
--

### P = \\(I^2R\\) = 4.23 kW, Q = \\(I^2X\\) = 3.17 kvar, S = 5.29 kVA
#### Check it on the explorer slide: the RL preset is this load

---
# Why do we care about power factor?
## A 10 kW load on a 230 V supply:
## PF = 1.0 → I = 43.5 A, PF = 0.8 → I = 54.3 A
--

### 25% more current → \\(1.25^2\\) = 56% more cable loss (\\(I^2R\\)), plus larger cables and transformers
--

### That's why industrial consumers pay penalties for reactive energy
--

### Solution: a parallel capacitor supplies Q locally. For the previous example, about 191 µF brings PF to 1.
