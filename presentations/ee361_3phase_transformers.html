# Wye-Wye: (\\(Y-Y\\))
![](wye_wye.png)

- ### Not very common
- ### 3rd Harmonics problem
- ### Phase Shift: 0
---
# Delta-Delta: (\\(\Delta- \Delta\\))
![](delta_delta.png)

- ### Common in medium voltage transformers
- ### No 3rd Current Harmonics in line currents
- ### Phase Shift: 0

---
# Wye-Delta: (\\(Y-\Delta\\))
![](wye_delta_t.png)

- ### Usually as step-down transformer
- ### Phase shift of 30 deg. between primary and secondary line-to-line voltages
---
# Delta-Wye: (\\(\Delta-Y\\))
![](delta_wye_t.png)

- ### Usually as step-up transformer
- ### Also used in distribution transformers (because of neutral on the LV side)
- ### Phase shift of 30 deg. between primary and secondary line-to-line voltages

# Turns-Ratio vs Line Voltage Ratio

- ## Turns Ratio: \\(n=\frac{N\_1}{N\_2}=\frac{V1\_{ph}}{V2\_{ph}}\\)
--

- ## Line-to-line Voltage Ratio: \\(=\frac{V1\_{line-to-line}}{V2\_{line-to-line}}\\)
--

### For (\\(Y-\Delta\\)) and (\\(\Delta-Y\\))
### !! Line-to-line voltage  ratio \\(\ne\\) Turns ratio
--

### Line-to-line voltage ratio is more useful in 3-phase transformers

#Example on 3-ph Transformers

## Three single-phase, 2 MVA, 10 kV/230 V 50 Hz transformers are connected in \\(\Delta-Y\\) configuration to form a three-phase transformer bank.

--
## b) Determine the total power rating of the system
--

## c) Determine the turns ratio and line-to-line voltage ratio of the transformer
---
## Assume the transformer has an equivalent reactance transferred to LV side : \\(jx_1' + jx_2 = j8m\Omega \\)
--

## The HV side is connected to a source which has a series reactance \\(jX_s=j0.3125 \Omega \\) and the LV side is connected to load through a feeder having \\(jX_f=j1.5m\Omega\\).
--

## d) Draw the three phase equivalent circuit and the referred to LV side on per-phase  wye equivalent circuit.
---

## e) Now assume the load is drawing rated current at unity pf. when phase voltage(i.e. line-to-neutral) at the load is 230 V. Calculate the referred voltage \\(V_s'\\) and the actual line-to-line voltage of the source.
---
# Example: Solution
### a) HV (Δ): \\(V\_{LL}\\) = 10 kV, \\(I\_L = \frac{6\,MVA}{\sqrt3 \cdot 10\,kV}\\) = 346 A
### LV (Y): \\(V\_{LL} = \sqrt3 \cdot 230\\) = 398 V, \\(I\_L\\) = 8.70 kA

### b) \\(S = 3 \times 2\\) = 6 MVA

### c) Turns ratio 10000/230 = 43.5, V-line ratio 10000/398 = 25.1

#### d) \\(X\_s' = 0.3125/25.1^2\\) = 0.5 mΩ → total \\(j(0.5 + 8 + 1.5)\\) = j10 mΩ per phase

#### e) \\(V\_s' = 230 + j\,8696 \times 0.010\\) = 245.9∠20.7° V → \\(E\_{s,LL} = 245.9 \cdot \sqrt3 \cdot 25.1\\) = 10.69 kV

## Example (P.Sen Ex. 2.8): Solution (per-phase Y, LV side)
#### \\(I = \frac{27\,kVA}{\sqrt3 \cdot 230}\\) = 67.8∠−25.8° A, \\(V\_L\\) = 132.8 V
--

#### Transformer (Δ side → Y): \\((0.12+j0.25)/3\\) = 0.04 + j0.083 Ω
#### HV feeder: \\((0.8+j5.0)/10.0^2\\) = 0.008 + j0.050 Ω (line ratio \\(\sqrt3\cdot1330/230 = 10.0\\))
--

#### \\(Z\_{tot}\\) = 0.051 + j0.148 Ω → \\(V\_s'\\) = 140.5 V
--

#### \\(V\_{s,LL} = 140.5 \times 10.0 \times \sqrt3\\) = **2437 V**
